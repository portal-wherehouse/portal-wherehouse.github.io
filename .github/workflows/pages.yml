# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# When the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set, pushes to main also publish
# the same build to Cloudflare Pages for the custom domain (see "Custom domain" in the README).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - run: npm ci --prefix firebase/functions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:firebase
      - run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publishes the same build to Cloudflare Pages (project "wherehouse"), which serves the custom domain.
  # Skipped until the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are both set.
  cloudflare:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: wherehouse
    steps:
      - id: secrets
        name: Check for Cloudflare secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set, so Cloudflare Pages is skipped."
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The build job's dist, exactly as published to GitHub Pages.
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - if: steps.secrets.outputs.ready == 'true'
        name: Unpack the build
        run: |
          mkdir dist
          tar -xf artifact/artifact.tar -C dist
          test -f dist/index.html
      - if: steps.secrets.outputs.ready == 'true'
        name: Create the Pages project if it does not exist
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          if [ "$status" = "404" ]; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
          elif [ "$status" != "200" ]; then
            echo "::error::Cloudflare answered $status when looking up the Pages project. Check the token's Cloudflare Pages Edit permission and the account ID."
            exit 1
          fi
      - if: steps.secrets.outputs.ready == 'true'
        name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
